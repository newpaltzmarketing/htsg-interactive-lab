name: Deploy demonstration preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-demo-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    environment: demo-preview
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check && npm test && npm run build
      - run: npm run test:browser
      - run: npm run test:upgrade
      - name: Deploy to the separate Pages preview branch
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name htsg-interactive-lab --branch demo-preview
