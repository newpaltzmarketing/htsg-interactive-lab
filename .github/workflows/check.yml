name: Validate static demo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run test:browser
      - run: npm run test:polish
      - run: npm run test:controls
      - run: npm run test:expansion
      - run: npm run test:crossword
      - run: npm run test:upgrade
      - run: npm run test:gamification
      - run: npm run test:community
      - run: npm run build
      - run: npm run test:share
      - uses: actions/upload-artifact@v4
        with:
          name: htsg-interactive-lab-static
          path: dist/
          retention-days: 7
      - run: npm run package:wordpress
      - run: php -l wordpress/htsg-interactive-lab/htsg-interactive-lab.php
      - run: php tests/wordpress.test.php
      - uses: actions/upload-artifact@v4
        with:
          name: htsg-interactive-lab-wordpress
          path: release/htsg-interactive-lab-wordpress-*.zip
          retention-days: 7
